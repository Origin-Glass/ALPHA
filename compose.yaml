name: alpha

x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgres://alpha:${POSTGRES_PASSWORD:-alpha-local-only}@db:5432/alpha
  SESSION_SECRET: ${SESSION_SECRET:-alpha-local-session-secret-32-bytes}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
  TEST_IDENTITY_ENABLED: ${TEST_IDENTITY_ENABLED:-false}
  TRUST_PROXY_HEADERS: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  PAYMENTS_ENABLED: "false"
  PAYMENT_PROVIDER: disabled
  AI_ENABLED: "false"
  AI_PROVIDER: disabled
  SOLVED_AC_ENABLED: "false"

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: alpha
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha-local-only}
    volumes:
      - alpha-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha -d alpha"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: alpha-api:local
    build:
      context: .
      target: runtime
    command: ["migrate"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: alpha-api:local
    build:
      context: .
      target: runtime
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    image: alpha-web:local
    build:
      context: web
    ports:
      - "${ALPHA_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,noexec,nosuid,nodev
      - /var/run:size=4m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  metadata-worker:
    image: alpha-api:local
    command: ["metadata_worker"]
    environment:
      <<: *app-environment
      METADATA_REFRESH_INTERVAL_SECONDS: ${METADATA_REFRESH_INTERVAL_SECONDS:-3600}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  judge-image:
    image: alpha-judge-runner:local
    build:
      context: judge
    command: ["/bin/true"]
    restart: "no"

  judge-worker:
    image: alpha-judge-worker:local
    build:
      context: .
      target: worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://alpha:${POSTGRES_PASSWORD:-alpha-local-only}@db:5432/alpha
      JUDGE_IMAGE: alpha-judge-runner:local
      JUDGE_WORKER_ID: compose-worker-1
      TMPDIR: ${ALPHA_JUDGE_WORKSPACE:-/tmp/alpha-judge-work}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ALPHA_JUDGE_WORKSPACE:-/tmp/alpha-judge-work}:${ALPHA_JUDGE_WORKSPACE:-/tmp/alpha-judge-work}
    depends_on:
      migrate:
        condition: service_completed_successfully
      judge-image:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,nosuid,nodev
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  alpha-db:

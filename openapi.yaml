openapi: 3.1.0
info:
  title: ALPHA API
  version: 1.0.1
  description: 한국어 우선 온라인 저지·소프트웨어 학습 플랫폼의 운영 API 계약
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /

security:
  - sessionCookie: []

x-security:
  public: &public []
  write: &write
    - sessionCookie: []
      csrfHeader: []

x-parameters:
  provider: &provider
    name: provider
    in: path
    required: true
    schema: { type: string, enum: [google, github] }
  slug: &slug
    name: slug
    in: path
    required: true
    schema: { type: string }
  level: &level
    name: level
    in: path
    required: true
    schema: { type: integer, minimum: 1, maximum: 9 }
  handle: &handle
    name: handle
    in: path
    required: true
    schema: { type: string }
  post_id: &post_id
    name: post_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  answer_id: &answer_id
    name: answer_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  report_id: &report_id
    name: report_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  external_problem_id: &external_problem_id
    name: external_problem_id
    in: path
    required: true
    schema: { type: string }
  organization_id: &organization_id
    name: organization_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  class_id: &class_id
    name: class_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  submission_id: &submission_id
    name: submission_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  id: &id
    name: id
    in: path
    required: true
    schema: { type: string, format: uuid }

x-responses:
  ok: &ok
    "200":
      description: 성공
      content:
        application/json:
          schema: {}
    "400": { $ref: "#/components/responses/BadRequest" }
    "401": { $ref: "#/components/responses/Unauthorized" }
    "403": { $ref: "#/components/responses/Forbidden" }
    "404": { $ref: "#/components/responses/NotFound" }
    "429": { $ref: "#/components/responses/RateLimited" }
  write_result: &write_result
    "200":
      description: 성공
      content:
        application/json:
          schema: {}
    "201":
      description: 생성됨
      content:
        application/json:
          schema: {}
    "204": { description: "성공, 응답 본문 없음" }
    "400": { $ref: "#/components/responses/BadRequest" }
    "401": { $ref: "#/components/responses/Unauthorized" }
    "403": { $ref: "#/components/responses/Forbidden" }
    "404": { $ref: "#/components/responses/NotFound" }
    "409": { $ref: "#/components/responses/Conflict" }
    "429": { $ref: "#/components/responses/RateLimited" }

paths:
  /health/live:
    get:
      operationId: healthLive
      security: *public
      responses: *ok
  /health/ready:
    get:
      operationId: healthReady
      security: *public
      responses:
        "200": { description: 데이터베이스 포함 준비 완료 }
        "503": { description: 준비되지 않음 }
  /metrics:
    get:
      operationId: metrics
      security: *public
      responses:
        "200":
          description: Prometheus 텍스트 지표
          content:
            text/plain:
              schema: { type: string }
        "503": { description: 지표 생성 실패 }

  /api/v1/auth/providers:
    get:
      operationId: authProviders
      security: *public
      responses: *ok
  /api/v1/auth/test-session:
    post:
      operationId: createTestSession
      security: *public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestSessionRequest" }
      responses: *write_result
  /api/v1/auth/me:
    get:
      operationId: authMe
      responses: *ok
  /api/v1/auth/terms:
    post:
      operationId: acceptTerms
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermsRequest" }
      responses: *write_result
  /api/v1/auth/{provider}/start:
    parameters: [*provider]
    get:
      operationId: oauthStart
      security: *public
      responses:
        "302": { description: OAuth 제공자로 이동 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/{provider}/callback:
    parameters: [*provider]
    get:
      operationId: oauthCallback
      security: *public
      responses:
        "302": { description: 검증 완료 후 서비스로 이동 }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      security: *write
      responses: *write_result

  /api/v1/policies:
    get:
      operationId: listPolicies
      responses:
        "200":
          description: 정책 원문과 현재 사용자의 동의 스냅샷
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/policies/consents:
    post:
      operationId: consentToPolicy
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyConsentRequest" }
      responses:
        "200":
          description: 정책 동의 기록 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyConsentResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/data-requests:
    post:
      operationId: createDataRequest
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DataRequestInput" }
      responses:
        "201":
          description: 개인정보 내보내기 또는 삭제 요청 생성
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequestCreatedResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/data-requests/{id}:
    parameters: [*id]
    get:
      operationId: getDataRequest
      responses:
        "200":
          description: 현재 사용자가 소유한 개인정보 요청
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/data-requests/{id}/cancel:
    parameters: [*id]
    post:
      operationId: cancelDataRequest
      security: *write
      responses:
        "200":
          description: 대기 중인 개인정보 요청 취소
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataRequestCancelledResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/onboarding:
    get:
      operationId: onboardingQuestions
      security: *public
      responses: *ok
  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses: *write_result

  /api/v1/content/providers:
    get:
      operationId: listContentProviders
      responses:
        "200": { $ref: "#/components/responses/ContentProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createContentProvider
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentProviderRequest" }
      responses:
        "201": { $ref: "#/components/responses/ContentProviderCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateContentProvider
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, supports_stream, supports_tools, fallback_provider_id]
              properties:
                enabled: { type: boolean }
                supports_stream: { type: boolean, const: false }
                supports_tools: { type: boolean, const: false }
                fallback_provider_id:
                  oneOf:
                    - { type: string, format: uuid }
                    - { type: "null" }
      responses:
        "200": { $ref: "#/components/responses/ContentProviderUpdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/providers/{id}/validate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: validateContentProviderConfiguration
      security: *write
      responses:
        "200": { $ref: "#/components/responses/ContentProviderValidated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs:
    get:
      operationId: listContentGenerationJobs
      responses:
        "200": { $ref: "#/components/responses/ContentJobList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createContentGenerationJob
      security: *write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentGenerationJobRequest" }
      responses:
        "201": { $ref: "#/components/responses/ContentJobMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/compare:
    get:
      operationId: compareContentGenerationJobs
      parameters:
        - { name: left, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ContentJobComparison" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/{id}:
    parameters: [*id]
    get:
      operationId: contentGenerationJobDetail
      responses:
        "200": { $ref: "#/components/responses/ContentJobDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/{id}/cancel:
    parameters: [*id]
    post:
      operationId: cancelContentGenerationJob
      security: *write
      requestBody: { $ref: "#/components/requestBodies/ContentJobAction" }
      responses:
        "200": { $ref: "#/components/responses/ContentJobMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/{id}/retry:
    parameters: [*id]
    post:
      operationId: retryContentGenerationJob
      security: *write
      requestBody: { $ref: "#/components/requestBodies/ContentJobAction" }
      responses:
        "200": { $ref: "#/components/responses/ContentJobMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/{id}/clone:
    parameters: [*id]
    post:
      operationId: cloneContentGenerationJob
      security: *write
      requestBody: { $ref: "#/components/requestBodies/ContentJobAction" }
      responses:
        "200": { $ref: "#/components/responses/ContentJobMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/jobs/{id}/archive:
    parameters: [*id]
    post:
      operationId: archiveContentGenerationJob
      security: *write
      requestBody: { $ref: "#/components/requestBodies/ContentJobAction" }
      responses:
        "200": { $ref: "#/components/responses/ContentJobArchived" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/reviews:
    get:
      operationId: listContentReviews
      responses:
        "200": { $ref: "#/components/responses/ContentReviewList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createContentReview
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewCreateRequest" } } } }
      responses:
        "201": { $ref: "#/components/responses/ContentReviewMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /api/v1/content/reviews/{id}:
    parameters: [*id]
    get:
      operationId: contentReviewDetail
      responses:
        "200": { $ref: "#/components/responses/ContentReviewDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/content/reviews/{id}/ai-receipts:
    parameters: [*id]
    post:
      operationId: recordIndependentAiReviewReceipt
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiReviewReceiptRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/provenance:
    parameters: [*id]
    post:
      operationId: recordExactContentProvenance
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentProvenanceRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentProvenanceRecorded" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/human:
    parameters: [*id]
    post:
      operationId: decideHumanContentReview
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HumanReviewDecisionRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/rights:
    parameters: [*id]
    post:
      operationId: decideContentRightsReview
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RightsReviewDecisionRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/pilot:
    parameters: [*id]
    post:
      operationId: recordContentPilotEvidence
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PilotReceiptRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/revise:
    parameters: [*id]
    post:
      operationId: reviseContentReviewArtifact
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewRevisionRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/publish:
    parameters: [*id]
    post:
      operationId: publishApprovedContentReview
      security: *write
      requestBody: { $ref: "#/components/requestBodies/ContentJobAction" }
      responses: { "200": { $ref: "#/components/responses/ContentReviewMutation" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" }, "422": { $ref: "#/components/responses/UnprocessableEntity" } }
  /api/v1/content/reviews/{id}/unpublish:
    parameters: [*id]
    post:
      operationId: unpublishReviewedContent
      security: *write
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewReasonRequest" } } } }

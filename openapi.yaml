    post: { summary: 포트폴리오 초안, security: *write, requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePortfolioRequest" } } } }, responses: { "200": { description: 멱등 재생, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }, "201": { description: 초안, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }, "400": { $ref: "#/components/responses/Error" } } }
  /api/v1/portfolio/rights:

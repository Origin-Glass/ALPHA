  /api/v1/portfolio/{id}:
    get: { summary: 소유한 포트폴리오 상세, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: 상세, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }, "404": { $ref: "#/components/responses/Error" } } }
  /api/v1/portfolio/{id}/publish:
    post: { summary: 포트폴리오 게시, security: *write, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: 게시됨, content: { application/json: { schema: { $ref: "#/components/schemas/PortfolioItem" } } } }, "409": { $ref: "#/components/responses/Error" } } }
  /api/v1/portfolio/public/{id}:
    get: { summary: 공개 포트폴리오, security: *public, parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }], responses: { "200": { description: 공개 투영, content: { application/json: { schema: { $ref: "#/components/schemas/PublicPortfolioItem" } } } }, "404": { $ref: "#/components/responses/Error" } } }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: alpha_session
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token

  responses:
    BadRequest:
      description: 요청 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 유효한 세션 필요
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: CSRF 또는 권한 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 현재 상태와 충돌
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: JSON 본문이 요청 스키마와 일치하지 않음
      content:
        text/plain:
          schema: { type: string }
    InternalError:
      description: 서버 내부 처리 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 요청 제한 초과
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ContentProviderList:
      description: 제공자 목록
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentProviderListResponse" } } }
    ContentJobList:
      description: 소유자 작업 목록
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentJobListResponse" } } }
    ContentJobDetail:
      description: 작업·시도·불변 산출물·감사 상세
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentJobDetailResponse" } } }
    ContentJobComparison:
      description: 두 작업의 최신 산출물 비교
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentJobComparisonResponse" } } }
    ContentBudget:
      description: 콘텐츠 생성 예산
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentBudgetResponse" } } }
    ContentProviderCreated:
      description: 제공자 생성 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentProviderCreatedResponse" } } }
    ContentProviderUpdated:
      description: 제공자 운영 설정 변경 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentProviderUpdatedResponse" } } }
    ContentProviderValidated:
      description: 제공자 구성 검증 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentProviderValidatedResponse" } } }
    ContentJobMutation:
      description: 콘텐츠 작업 생성·상태 변경 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentJobMutationResponse" } } }
    ContentJobArchived:
      description: 콘텐츠 작업 보관 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentJobArchivedResponse" } } }
    ContentBudgetUpdated:
      description: 콘텐츠 예산 변경 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentBudgetUpdatedResponse" } } }
    ContentReviewList:
      description: 역할 범위 또는 소유자 검토 대기열
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewListResponse" } } }
    ContentReviewDetail:
      description: 현재 불변 리비전과 독립 AI 검토 증거
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewDetailResponse" } } }
    ContentReviewMutation:
      description: 검토 상태 전이 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentReviewMutationResponse" } } }
    ContentProvenanceRecorded:
      description: 현재 불변 리비전에 결속된 출처 기록 결과
      content: { application/json: { schema: { $ref: "#/components/schemas/ContentProvenanceRecordedResponse" } } }
    PublicReviewedContent:
      description: 게시 승인된 학습자 안전 필드만 포함한 콘텐츠
      content: { application/json: { schema: { $ref: "#/components/schemas/PublicReviewedContentResponse" } } }

  requestBodies:
    ContentJobAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [idempotency_key]
            properties:
              idempotency_key: { type: string, format: uuid }

  schemas:
    OperationalActionItem:
      type: object
      additionalProperties: false
      required: [resource_id, state, reason, age_seconds]
      properties:
        resource_id: { type: string, format: uuid }
        state: { type: string }
        reason:
          type: string
          enum: [provider_disabled, provider_unhealthy, provider_unverified, expired_lease, missing_credential, generation_failed, ai_review_pending, human_review_pending, rights_review_pending, pilot_pending, removal_pending, rights_not_approved, missing_provenance, missing_rights_approval, commercial_use_denied, redistribution_denied, stale_revision_evidence, no_learning_event_7d, workspace_failed]
        age_seconds: { type: integer, format: int64, minimum: 0 }
    OperationalSnapshot:
      type: object
      additionalProperties: false
      required: [providers, generation_jobs, reviews, rights, learning, workspaces]
      properties:
        providers:
          type: object
          additionalProperties: false
          required: [unhealthy, unverified, disabled, action_items]
          properties:
            unhealthy: { type: integer, format: int64, minimum: 0 }
            unverified: { type: integer, format: int64, minimum: 0 }
            disabled: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
        generation_jobs:
          type: object
          additionalProperties: false
          required: [queued, running, expired_leases, failed, blocked, action_items]
          properties:
            queued: { type: integer, format: int64, minimum: 0 }
            running: { type: integer, format: int64, minimum: 0 }
            expired_leases: { type: integer, format: int64, minimum: 0 }
            failed: { type: integer, format: int64, minimum: 0 }
            blocked: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
        reviews:
          type: object
          additionalProperties: false
          required: [ai_pending, human_pending, rights_pending, pilot_pending, removal_pending, action_items]
          properties:
            ai_pending: { type: integer, format: int64, minimum: 0 }
            human_pending: { type: integer, format: int64, minimum: 0 }
            rights_pending: { type: integer, format: int64, minimum: 0 }
            pilot_pending: { type: integer, format: int64, minimum: 0 }
            removal_pending: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
        rights:
          type: object
          additionalProperties: false
          required: [publication_blockers, action_items]
          properties:
            publication_blockers: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
        learning:
          type: object
          additionalProperties: false
          required: [active_projects, stalled_projects, action_items]
          properties:
            active_projects: { type: integer, format: int64, minimum: 0 }
            stalled_projects: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
        workspaces:
          type: object
          additionalProperties: false
          required: [queued, running, expired_leases, failed, action_items]
          properties:
            queued: { type: integer, format: int64, minimum: 0 }
            running: { type: integer, format: int64, minimum: 0 }
            expired_leases: { type: integer, format: int64, minimum: 0 }
            failed: { type: integer, format: int64, minimum: 0 }
            action_items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperationalActionItem" } }
    LearningPlanRequest:
      type: object
      additionalProperties: false
      required: [rule_version, idempotency_key, target_outcome, weekly_minutes, preferred_language, path_mode, interests, goals, diagnostic_scores, deadline, preferred_framework, desired_project, required_curriculum, instructor_constraints, assessment_checkpoints, assistance_policy, privacy, origin, template_id, locked_requirements]
      properties:
        rule_version: { type: string, const: project-learning-v1 }
        idempotency_key: { type: string, format: uuid }
        target_outcome: { type: string, minLength: 1, maxLength: 300 }
        weekly_minutes: { type: integer, minimum: 30, maximum: 2400 }
        preferred_language: { type: string, pattern: "^[a-z0-9+#.-]{1,32}$" }
        path_mode: { type: string, enum: [structured, exploratory] }
        interests: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 80 } }
        goals: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 120 } }
        diagnostic_scores:
          type: object
          additionalProperties: false
          required: [algorithmic_reasoning, code_literacy, docs_learning, independent_coding]
          properties:
            algorithmic_reasoning: { type: integer, minimum: 0, maximum: 100 }
            code_literacy: { type: integer, minimum: 0, maximum: 100 }
            docs_learning: { type: integer, minimum: 0, maximum: 100 }
            independent_coding: { type: integer, minimum: 0, maximum: 100 }
        deadline: { type: string, format: date }
        preferred_framework: { type: string, minLength: 1, maxLength: 64 }
        desired_project: { type: string, minLength: 1, maxLength: 200 }
        required_curriculum: { type: array, minItems: 1, maxItems: 12, items: { type: string, minLength: 1, maxLength: 120 } }
        instructor_constraints: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
        assessment_checkpoints: { type: array, minItems: 1, maxItems: 12, items: { type: string, minLength: 1, maxLength: 160 } }
        assistance_policy: { $ref: "#/components/schemas/AssistanceMode" }
        privacy: { type: string, enum: [private, instructors, classroom] }
        origin: { type: string, enum: [learner, template_assignment] }
        template_id: { type: [string, "null"], format: uuid, description: template_assignment일 때 필수이며 learner일 때 null }
        locked_requirements: { type: array, maxItems: 12, items: { type: string, minLength: 1, maxLength: 160 }, description: template_assignment일 때 1개 이상, learner일 때 빈 배열 }
    LearningPlanResponse:
      type: object
      additionalProperties: false

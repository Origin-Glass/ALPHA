[package]
name = "alpha"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.17", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

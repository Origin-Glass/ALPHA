[package]
name = "alpha"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8.4"
async-stream = "0.3"
base64 = "0.22"
futures-core = "0.3"
getrandom = "0.4"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
tokio = { version = "1.46", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.17", features = ["serde", "v7"] }
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
